services:
  - type: web
    name: magicpin-vera-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LLM_PROVIDER
        value: ""
      - key: LLM_API_KEY
        value: ""
